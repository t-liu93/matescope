[project]
name = "matescope"
version = "0.1.0"
description = "A self-hosted responsive interface for TeslaMate data"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.141.1",
  "pydantic-settings==2.15.0",
  "uvicorn[standard]==0.52.4",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "mypy==1.18.2",
  "pytest==8.4.2",
  "ruff==0.13.2",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.uv]
package = false

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
strict = true
python_version = "3.13"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
