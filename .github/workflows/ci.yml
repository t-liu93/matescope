name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: Commit SHA to check (the release tag's target commit).
        required: false
        type: string
permissions:
  contents: read
env:
  MATESCOPE_PUBLIC_URL: http://127.0.0.1:8000
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      # A release passes the tag target SHA so this suite never checks a
      # branch tip that differs from the tagged source.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - uses: astral-sh/setup-uv@v6
        with: { version: '0.11.8' }
      - uses: pnpm/action-setup@v4
        with: { version: '11.7.0' }
      - uses: actions/setup-node@v4
        with: { node-version: '22.23.1', cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - run: uv sync --locked
      - run: uv run ruff check backend scripts
      - run: python scripts/check_release_tag.py --self-test
      - run: uv run mypy backend/matescope
      - run: docker compose -p matescope-ci-sql -f compose.yaml -f compose.dev.yaml -f compose.test.yaml up --detach --wait postgres mqtt mail
      - run: uv run pytest --junitxml=ci-artifacts/backend.xml
        env:
          MATESCOPE_TEST_OPTIONAL_SERVICES: matescope-synthetic-m0-t05
          MATESCOPE_TEST_PG_DSN: postgresql://teslamate_admin:synthetic-only@127.0.0.1:15432/teslamate_synthetic
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend rebuild esbuild --config.ignore-scripts=false
      - run: pnpm --dir frontend exec playwright install --with-deps chromium
      - run: uv run python scripts/export_openapi.py
      - run: pnpm --dir frontend generate:api
      - run: git diff --exit-code -- openapi.json frontend/src/api/schema.d.ts
      - run: pnpm --dir frontend lint
      - run: pnpm --dir frontend typecheck
      - run: pnpm --dir frontend test
      - run: pnpm --dir frontend build
      - run: docker compose -f compose.yaml -f compose.dev.yaml config --quiet
      - run: docker build --tag matescope:ci .
      - run: docker compose -p matescope-ci -f compose.yaml -f compose.dev.yaml up --build --detach
      - run: timeout 90 sh -c 'until curl --fail http://127.0.0.1:8000/api/v1/health && curl --fail http://127.0.0.1:8000/api/v1/readiness && curl --fail http://127.0.0.1:8000/ | grep -q MateScope; do sleep 2; done'
      - run: PLAYWRIGHT_BASE_URL=http://127.0.0.1:8000 pnpm --dir frontend test:smoke
        env:
          MATESCOPE_E2E_REAL_PG: '1'
      - run: python scripts/check_recovery.py --project matescope-ci --port 8000
        env:
          MATESCOPE_TEST_RECOVERY: matescope-synthetic-m0-t07
      - if: always()
        run: mkdir -p ci-artifacts && docker compose -p matescope-ci -f compose.yaml -f compose.dev.yaml logs --no-color > ci-artifacts/compose.log || true
      - if: always()
        run: docker compose -p matescope-ci-sql -f compose.yaml -f compose.dev.yaml -f compose.test.yaml logs --no-color > ci-artifacts/synthetic-services.log || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: |
            ci-artifacts/backend.xml
            ci-artifacts/synthetic-services.log
          if-no-files-found: ignore
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs
          path: ci-artifacts/compose.log
          if-no-files-found: ignore
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: frontend/test-results
          if-no-files-found: ignore
      - if: always()
        run: docker compose -p matescope-ci-sql -f compose.yaml -f compose.dev.yaml -f compose.test.yaml down --volumes || true
      - if: always()
        run: docker compose -p matescope-ci -f compose.yaml -f compose.dev.yaml down --volumes || true
