name: matescope
services:
  app:
    image: matescope:local
    environment:
      MATESCOPE_DATA_DIR: /app/data
    ports:
      - "127.0.0.1:${MATESCOPE_PORT:-8000}:8000"
    volumes:
      - matescope-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

volumes:
  matescope-data:
